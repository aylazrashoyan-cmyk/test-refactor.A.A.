<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>Метраж</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --emerald:#0f766e; --emerald-l:#d1fae5; --red:#dc2626; --red-l:#fee2e2;
    --amber:#d97706; --amber-l:#fef3c7; --blue:#2563eb; --gray:#9ca3af;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.4}
  #app{max-width:720px;margin:0 auto;padding-bottom:88px;min-height:100vh}
  header.top{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:50;
    border-bottom:1px solid var(--line)}
  header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
  header.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .store-btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .store-btn:after{content:"▾";font-size:12px;color:var(--muted)}
  main{padding:12px 16px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;
    box-shadow:var(--shadow);margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:0 0 10px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .emerald{color:var(--emerald)} .red{color:var(--red)} .muted{color:var(--muted)}
  .small{font-size:12px} .tiny{font-size:11px}
  .progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
  .progress>i{display:block;height:100%;border-radius:4px;transition:width .3s}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kit{background:var(--bg);border-radius:10px;padding:10px}
  .kit b{display:block;font-size:15px;margin-top:2px}
  .kit .share{font-size:11px;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%}
  .list-item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
    background:var(--bg);color:var(--muted)}
  .pill.hot{background:var(--emerald-l);color:var(--emerald)}
  .pill.cold{background:var(--red-l);color:var(--red)}
  .pill.mid{background:var(--amber-l);color:var(--amber)}
  .tabs{display:flex;gap:4px;margin:10px 0}
  .tabs button{flex:1;padding:8px;border:0;background:var(--card);border-radius:10px;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button.active{background:var(--emerald);color:#fff}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;max-width:720px;margin:0 auto;
    z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom button{flex:1;border:0;background:none;padding:10px 0 12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
    color:var(--muted);cursor:pointer}
  nav.bottom button.active{color:var(--emerald);font-weight:600}
  nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 14px;border:0;border-radius:10px;background:var(--emerald);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--bg);color:var(--text)}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.block{width:100%}
  .input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff;color:var(--text)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
    display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:720px;
    max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal h3{margin:0 0 10px;font-size:18px}
  .modal .close{position:absolute;right:16px;top:14px;border:0;background:none;
    font-size:20px;color:var(--muted);cursor:pointer}
  .hidden{display:none!important}
  .heat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
  .search{position:relative}
  .search-list{max-height:240px;overflow:auto;margin-top:6px;border:1px solid var(--line);
    border-radius:10px}
  .search-list .it{padding:10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .search-list .it:hover{background:var(--bg)}
  .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--emerald);
    border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="bottom" id="nav"></nav>
</div>
<div id="modal-root"></div>

<script>
/* ============================================================
   МЕТРАЖ v2.1 — единый файл
   Секции:
   1. Константы
   2. DB (LocalStorage)
   3. Утилиты
   4. Парсер XLSX (Этап 1)
   5. Расчёты: распределение выручки, ABC, тепловая карта, SMLY, прогноз
   6. Рендер: Главная
   7. Рендер: Аналитика
   8. Рендер: Рейлы и Стены (Дашборд + Справочник)
   9. Рендер: Настройки
   10. Модалки (импорт, магазины, шторка папки, CRUD)
   11. Роутер
   ============================================================ */

/* ---------- 1. КОНСТАНТЫ ---------- */
const SERVICE_KEYWORDS = ["Распродажа","Будут удалены","Спец костюм",
  "под вопросом","возможно будет удален","Архив"];

const GENDER_RULES = [
  { gender:"kids",   keywords:["детск","ребен","для мальчика","для девочки"] },
  { gender:"male",   keywords:["мужск","мальчик"] },
  { gender:"female", keywords:["женск","девочк"] }
];

const KIT_MAP = {
  "Одежда":"clothing","Обувь":"shoes","Аксессуары":"accessories",
  "Распродажа":"sale","Детская":"other","Будут удалены":"other",
  "Спец костюм":"other","Архив":"other"
};
const KIT_LABEL = { clothing:"Одежда", shoes:"Обувь", accessories:"Аксессуары", sale:"Распродажа" };

const SMLY_K = 1.10;
const DATE_BLOCK = "2026-10-01"; // магазин создан раньше — блокировка периода < 1.10.2026

/* ---------- 2. DB ---------- */
const DB_KEY = "metrag_db_v21";
let DB = null;

function dbDefault(){
  return {
    version:"2.1",
    stores:[],
    rows:[], rails:[], walls:[], brackets:[], tables:[],
    sales:{}, salesHistory:{},
    moves:[],
    overrides:{ gender:{} },
    meta:{ lastImport:{}, lastImportBackup:{}, ui:{} }
  };
}
function dbLoad(){
  try{ const raw = localStorage.getItem(DB_KEY); DB = raw ? JSON.parse(raw) : dbDefault(); }
  catch(e){ DB = dbDefault(); }
  if(!DB.meta) DB.meta = {lastImport:{},lastImportBackup:{},ui:{}};
  if(!DB.meta.ui) DB.meta.ui = {};
  if(!DB.overrides) DB.overrides = {gender:{}};
  if(!DB.overrides.gender) DB.overrides.gender = {};
}
function dbSave(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ alert("Ошибка сохранения: "+e.message); }
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* ---------- 3. УТИЛИТЫ ---------- */
const fmt = n => (n==null||isNaN(n)) ? "—" :
  new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(n));
const fmtM = n => (n==null||isNaN(n)) ? "—" : Number(n).toFixed(2).replace(".",",");
const pct = (a,b) => (!b||isNaN(b)) ? 0 : Math.round(a/b*100);

function currentStore(){
  const id = DB.meta.ui.storeId;
  return DB.stores.find(s=>s.id===id) || DB.stores[0] || null;
}
function currentPeriod(){
  return DB.meta.ui.period || defaultPeriod();
}
function defaultPeriod(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function periodLabel(p){
  if(!p) return "—";
  const [y,m] = p.split("-");
  const months = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return months[+m-1]+" "+y;
}
function monthDays(y,m){ return new Date(y,m,0).getDate(); }
function prevPeriod(p){
  const [y,m] = p.split("-").map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function sameMonthLastYear(p){
  const [y,m] = p.split("-").map(Number);
  return (y-1)+"-"+String(m).padStart(2,"0");
}
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* п.1.2 — пол: ручное переопределение > эвристика */
function detectGender(folderName){
  const ov = DB.overrides.gender[folderName];
  if(ov) return ov==="none" ? null : ov;
  const low = String(folderName).toLowerCase();
  for(const rule of GENDER_RULES){
    if(rule.keywords.some(k=>low.includes(k))) return rule.gender;
  }
  return null;
}
/* п.1.3 — кит по узлу 1-го уровня */
function detectKit(topName){
  return KIT_MAP[topName] || "other";
}
/* п.1.1 — служебная */
function isServiceName(name){
  return SERVICE_KEYWORDS.some(k=>String(name).includes(k));
}

/* ---------- 4. ПАРСЕР XLSX (Этап 1) ---------- */
/*
  Чек-лист №3: нормализация табов/пробелов, автоопределение шага.
  Чек-лист №2: поиск «Итого» + сверка с суммой листовых узлов.
  Чек-лист №1: ключ папки = полный путь.
*/
/* ---------- 4. ПАРСЕР XLSX (АДАПТИРОВАН ПОД ВЫГРУЗКУ 1С) ---------- */
function parseXlsx(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
  if(!rows.length) throw new Error("Лист пуст");

  return buildTreeFromXlsx(rows);
}

// Очистка названий от лишних символов и неразрывных пробелов
function cleanCellValue(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/\u00a0/g, ' ').trim();
}

// Проверка, является ли строка строкой с данными (есть числа в колонках D и E)
function isNumericRow(row) {
  if (!row || row.length < 5) return false;
  const valD = row[3];
  const valE = row[4];
  // Проверяем, что хотя бы одна из колонок содержит число (или строку, которую можно распарсить)
  const isNum = (v) => {
    if (typeof v === 'number' && isFinite(v)) return true;
    if (typeof v === 'string') {
      const cleaned = v.replace(/\s/g, '').replace(',', '.');
      return cleaned.length > 0 && !isNaN(parseFloat(cleaned));
    }
    return false;
  };
  return isNum(valD) || isNum(valE);
}

function buildTreeFromXlsx(rows) {
  const nodes = [];
  let currentPath = []; // Стек текущего пути (например: ["Одежда", "Женская", "Куртки"])

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[0]) continue;

    const name = cleanCellValue(row[0]);
    if (!name) continue;

    // Пропускаем технические заголовки
    if (["Продажи", "Магазин", "Склад", "Номенклатура", "Итого"].includes(name)) continue;

    const isNumRow = isNumericRow(row);

    if (isNumRow) {
      // Это строка с данными (Количество и Сумма).
      // Извлекаем числа из D (индекс 3) и E (индекс 4)
      let qty = 0, sum = 0;
      const parseNum = (v) => {
        if (typeof v === 'number') return v;
        if (typeof v === 'string') {
          const cleaned = v.replace(/\s/g, '').replace(',', '.');
          return parseFloat(cleaned) || 0;
        }
        return 0;
      };
      qty = parseNum(row[3]);
      sum = parseNum(row[4]);

      // Если это корневой узел (например, "Мода"), у него суммы совпадают с итогом.
      // Нам нужны только листья или промежуточные узлы (level >= 3).
      
      const level = currentPath.length + 1; // Уровень = глубина вложенности + 1
      const fullPath = [...currentPath, name].join("/");

      // Добавляем узел, если его еще нет (избегаем дублей, когда 1С выводит одну и ту же строку дважды)
      if (!nodes.find(n => n.path === fullPath)) {
        nodes.push({
          name: name,
          level: level,
          sum: sum,
          qty: qty,
          path: fullPath
        });
      }
    } else {
      // Это узел иерархии (папка). Пустые строки между блоками сбрасывают стек.
      // В файле 1С пустая строка означает, что закончился предыдущий блок.
      const prevRow = rows[i - 1];
      const prevIsEmpty = !prevRow || !prevRow[0] || cleanCellValue(prevRow[0]) === "";
      
      // Если предыдущая строка была пустой, а текущая - нет, это новый корневой блок.
      // Но в данном файле "Одежда", "Мужская", "Женская" идут подряд без пустых строк.
      // Поэтому мы ориентируемся на то, что папки, содержащие подпапки, не имеют сумм.
      // Логика проста: если мы встретили папку без чисел, она становится текущим родителем.
      
      // Чтобы правильно строить дерево, нужно понимать: это заголовок или подзаголовок?
      // В 1С это видно по тому, есть ли под ним строки с суммами.
      // Упростим: если строка без чисел, мы добавляем её в текущий путь.
      
      // Но как понять, что блок "Женская" закончился и начался "Мужская"?
      // В выгрузке 1С, если строка без чисел, а следующая за ней тоже без чисел, 
      // то это либо вложенная папка, либо новая папка того же уровня.
      
      // Эвристика: если имя текущей папки не встречается в предыдущих "открытых" папках,
      // и после неё идут строки с числами, значит, это папка.
      
      // В твоем файле: "Одежда" (без чисел) -> "Женская" (без чисел) -> "Куртки" (без чисел) -> "Куртка" (с числами).
      // Значит, стек должен быть ["Одежда", "Женская", "Куртки"], а "Куртка" - это уже узел с суммой.
      
      // Для простоты и надежности под твой файл:
      // Мы будем считать, что КАЖДАЯ строка без чисел - это папка.
      // Чтобы сбросить стек при переходе на новый корневой уровень (например, от "Женская" к "Мужская"),
      // мы ищем, есть ли уже такая папка в стеке. Если есть - обрезаем стек до неё.
      // Если нет - проверяем, есть ли отступ (в твоем файле отступов нет).
      
      // Так как в файле нет отступов, мы не можем отличить "Мужская" (на одном уровне с "Женская") 
      // от "Вехняя одежда" (внутри "Женская").
      
      // В файле 1С, как правило, корневые папки (Одежда, Обувь, Аксессуары) 
      // идут первыми в списке.
      
      // Самое надежное решение для этого формата:
      // Считать, что если мы встретили папку, и следующая за ней строка - это папка,
      // то предыдущая папка была завершена.
      
      // Но "Одежда" -> "Женская" -> "Куртки" - это три папки подряд.
      // Давай использовать жесткий список корневых папок.
      const rootFolders = ["Одежда", "Обувь", "Аксессуары", "Распродажа", "Детская", "Будут удалены"];
      
      if (rootFolders.includes(name)) {
        currentPath = [name]; // Сбрасываем стек, начинаем новый корень
      } else if (name === "Мужская" || name === "Женская" || name === "Мальчики" || name === "Девочки") {
        // Это второй уровень вложенности
        currentPath = [currentPath[0] || "Одежда", name];
      } else {
        // Это третий уровень и ниже (например, "Куртки", "Джинсы", "Кроссовки")
        currentPath = [currentPath[0] || "Одежда", currentPath[1] || "Прочее", name];
      }
    }
  }

  // Строим иерархию для проверки сходимости
  const roots = [];
  const rootMap = {};
  for (const n of nodes) {
    const parts = n.path.split("/");
    const rootName = parts[0];
    if (!rootMap[rootName]) {
      rootMap[rootName] = { name: rootName, sum: 0, level: 1, path: rootName, children: [] };
      roots.push(rootMap[rootName]);
    }
  }
  
  // Суммы корней (для проверки)
  for (const n of nodes) {
    if (n.level === 1) {
       const r = rootMap[n.name];
       if (r) r.sum = n.sum;
    }
  }

  const sumRoots = roots.reduce((s, r) => s + r.sum, 0);
  const sumLeaves = nodes.filter(n => n.level >= 3).reduce((s, n) => s + n.sum, 0);
  
  // Ищем строку "Итого"
  let totalRowSum = 0;
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i] && cleanCellValue(rows[i][0]) === "Итого") {
      totalRowSum = parseFloat(String(rows[i][4]).replace(/\s/g, '').replace(',', '.')) || 0;
      break;
    }
  }

  let convergence = null;
  if (totalRowSum > 0) {
    convergence = { expected: totalRowSum, got: sumLeaves, ok: Math.abs(totalRowSum - sumLeaves) < 1 };
  } else {
    convergence = { expected: sumRoots, got: sumLeaves, ok: Math.abs(sumRoots - sumLeaves) < 1, note: "Без строки Итого" };
  }

  return { nodes, roots, flat: false, convergence };
}
/* ---------- 5. РАСЧЁТЫ ---------- */
/*
  Распределение выручки между рейлами и стенами (п.4.1)
  — по погонному метру пола (D2)
*/
function distributeRevenue(storeId, folderPath){
  const s = DB.sales[storeId] || {};
  const folder = s[folderPath];
  if(!folder) return null;
  const revenue = folder.sum || 0;

  const rails = DB.rails.filter(r=>r.storeId===storeId && r.folder===folderPath);
  const walls = DB.walls.filter(w=>w.storeId===storeId && w.folder===folderPath);

  const railMeters = rails.reduce((a,r)=>a+(+r.length||0),0);
  const wallMeters = walls.reduce((a,w)=>a+(+w.length||0),0);
  const total = railMeters + wallMeters;

  const railOut = rails.map(r=>({
    kind:"rail", id:r.id, code:r.code, rowId:r.rowId, side:r.side,
    length:+r.length||0,
    revenue: total ? revenue * ((+r.length||0)/total) : 0,
    perMeter: total && (+r.length) ? (revenue*((+r.length)/total))/(+r.length) : 0
  }));
  const wallOut = walls.map(w=>({
    kind:"wall", id:w.id, code:w.code, rowId:w.rowId,
    length:+w.length||0, tiers:+w.tiers||1,
    revenue: total ? revenue * ((+w.length||0)/total) : 0,
    perMeterFloor: total && (+w.length) ? (revenue*((+w.length)/total))/(+w.length) : 0,
    perMeterGoods: (total && (+w.length) && (+w.tiers))
      ? (revenue*((+w.length)/total))/((+w.length)*(+w.tiers)) : 0,
    perTierRevenue: (+w.tiers) ? (revenue*((+w.length)/total))/(+w.tiers) : 0
  }));

  return { revenue, railMeters, wallMeters, totalMeters:total, rails:railOut, walls:wallOut, unplaced: total===0 };
}

/* все папки магазина с метражом и ₽/м */
function foldersWithMetrics(storeId){
  const s = DB.sales[storeId] || {};
  const out = [];
  for(const [path, f] of Object.entries(s)){
    const d = distributeRevenue(storeId, path);
    out.push({
      path, name: f.path ? f.path.split("/").pop() : path,
      sum: f.sum||0, qty: f.qty||0, level: f.level||3,
      isService: !!f.isService, isReturn: !!f.isReturn,
      railMeters: d ? d.railMeters : 0,
      wallMeters: d ? d.wallMeters : 0,
      totalMeters: d ? d.totalMeters : 0,
      perMeter: d && d.totalMeters ? d.revenue/d.totalMeters : 0,
      unplaced: d ? d.unplaced : true,
      gender: detectGender(f.path ? f.path.split("/").pop() : path)
    });
  }
  return out;
}

/* ABC (п.4.3) */
function computeABC(storeId, levelMin=3, byMeters=false){
  const all = foldersWithMetrics(storeId)
    .filter(f=>f.level>=levelMin && !f.isService && !f.isReturn);
  const placed = all.filter(f=>!f.unplaced);
  const metric = byMeters ? "totalMeters" : "sum";
  const sorted = placed.slice().sort((a,b)=>b[metric]-a[metric]);
  const total = sorted.reduce((s,x)=>s+x[metric],0);
  let cum = 0;
  const result = { A:[], B:[], C:[], unplaced: all.filter(f=>f.unplaced), total };
  for(const f of sorted){
    cum += f[metric];
    const share = total ? cum/total : 0;
    const group = share<=0.80 ? "A" : share<=0.95 ? "B" : "C";
    result[group].push(f);
  }
  return result;
}

/* тепловая карта (п.4.2) — перцентили P20/P80 по рейлам+стенам */
function heatmap(storeId){
  const vals = [];
  for(const r of DB.rails.filter(x=>x.storeId===storeId)){
    const d = distributeRevenue(storeId, r.folder);
    if(d && d.totalMeters>0){
      const rr = d.rails.find(x=>x.id===r.id);
      if(rr) vals.push(rr.perMeter);
    }
  }
  for(const w of DB.walls.filter(x=>x.storeId===storeId)){
    const d = distributeRevenue(storeId, w.folder);
    if(d && d.totalMeters>0){
      const ww = d.walls.find(x=>x.id===w.id);
      if(ww) vals.push(ww.perMeterFloor);
    }
  }
  if(!vals.length) return {p20:0,p80:0};
  const sorted = vals.slice().sort((a,b)=>a-b);
  const p20 = sorted[Math.floor(sorted.length*0.2)] ?? sorted[0];
  const p80 = sorted[Math.floor(sorted.length*0.8)] ?? sorted[sorted.length-1];
  return {p20, p80, values:sorted};
}
function heatClass(v, hm){
  if(v>=hm.p80) return "hot";
  if(v<=hm.p20) return "cold";
  return "mid";
}

/* SMLY план (п.4.4) */
function autoPlan(storeId, period){
  const store = DB.stores.find(s=>s.id===storeId);
  if(store && store.plan && store.plan.source==="manual") return {value:store.plan.value, source:"manual"};
  const hist = DB.salesHistory[storeId] || {};
  const lastYear = hist[sameMonthLastYear(period)];
  if(lastYear){
    const sum = Object.values(lastYear).reduce((a,b)=>a+(b.sum||b||0),0);
    if(sum>0) return {value: Math.round(sum*SMLY_K), source:"smly",
      label:`прошлый год × ${SMLY_K.toFixed(2)}`};
  }
  // 3 месяца
  const months = [];
  let p = period;
  for(let i=0;i<3;i++){
    p = prevPeriod(p);
    if(hist[p]) months.push(hist[p]);
  }
  if(months.length>=3){
    const totals = months.map(m=>Object.values(m).reduce((a,b)=>a+(b.sum||b||0),0));
    const avg = totals.reduce((a,b)=>a+b,0)/totals.length;
    return {value: Math.round(avg*SMLY_K), source:"3months",
      label:`среднее за 3 мес × ${SMLY_K.toFixed(2)}`};
  }
  return {value:0, source:"none", label:"Недостаточно данных — задайте вручную"};
}

/* прогноз месяца (п.4.5) */
function forecast(storeId, period){
  const now = new Date();
  const [y,m] = period.split("-").map(Number);
  const totalDays = monthDays(y,m);
  const isCurrent = (now.getFullYear()===y && now.getMonth()+1===m);
  if(!isCurrent) return null;
  const fact = totalRevenue(storeId, period);
  const daysPassed = Math.max(1, now.getDate());
  return Math.round((fact/daysPassed)*totalDays*1.05);
}

function totalRevenue(storeId, period){
  const s = DB.sales[storeId] || {};
  // если период не совпадает с последним импортом — берём из истории
  const hist = DB.salesHistory[storeId] || {};
  if(hist[period]){
    return Object.values(hist[period]).reduce((a,b)=>a+(b.sum||b||0),0);
  }
  return Object.values(s).reduce((a,f)=>a+(f.sum||0),0);
}

/* киты (п.1.3) */
function kitsBreakdown(storeId){
  const s = DB.sales[storeId] || {};
  const res = { clothing:0, shoes:0, accessories:0, sale:0, other:0 };
  for(const [path,f] of Object.entries(s)){
    const top = path.split("/")[0];
    const kit = detectKit(top);
    res[kit] = (res[kit]||0) + (f.sum||0);
  }
  return res;
}

/* отделы (п.1.4) */
function departmentsBreakdown(storeId){
  const s = DB.sales[storeId] || {};
  const deps = {};
  for(const [path,f] of Object.entries(s)){
    const parts = path.split("/");
    const top = parts[0];
    const kit = detectKit(top);
    const name = parts[parts.length-1];
    const gender = detectGender(name);
    let key;
    if(kit==="clothing") key = gender==="male" ? "Одежда · Мужской" :
                            gender==="female" ? "Одежда · Женский" :
                            gender==="kids" ? "Одежда · Детский" : "Одежда · Прочее";
    else if(kit==="shoes") key = "Обувь";
    else if(kit==="accessories") key = "Аксессуары";
    else if(kit==="sale") key = "Распродажа";
    else continue;
    if(!deps[key]) deps[key] = { sum:0, folders:[] };
    deps[key].sum += f.sum||0;
    deps[key].folders.push({path, name, sum:f.sum||0});
  }
  return Object.entries(deps).map(([k,v])=>({name:k, ...v}))
    .sort((a,b)=>b.sum-a.sum);
}

/* дельты с прошлого периода (п.4.6) */
function deltas(storeId, period){
  const cur = DB.salesHistory[storeId]?.[period] || {};
  const prev = DB.salesHistory[storeId]?.[prevPeriod(period)] || {};
  const all = new Set([...Object.keys(cur), ...Object.keys(prev)]);
  const out = [];
  for(const path of all){
    const c = cur[path]?.sum ?? cur[path] ?? 0;
    const p = prev[path]?.sum ?? prev[path] ?? 0;
    if(c||p) out.push({path, name:path.split("/").pop(), cur:c, prev:p, delta:c-p});
  }
  return out.sort((a,b)=>b.delta-a.delta);
}

    else if(f.gender==="kids") groups.kids.push(f);
  }
  // аксессуары — отдельно по киту
  for(const f of all){
    const top = f.path.split("/")[0];
    if(detectKit(top)==="accessories") groups.accessories.push(f);
  }
  const out = {};
  for(const g of ["male","female","kids","accessories"]){
    const arr = groups[g].slice().sort((a,b)=>b.sum-a.sum).slice(0,5);
    if(arr.length) out[g] = { items:arr, total: groups[g].length };
  }
  return out;

function showRecommendations(){
  const store = currentStore(); if(!store) return;
  const folders = foldersWithMetrics(store.id).filter(f=>!f.unplaced && !f.isService && !f.isReturn);
  const hm = heatmap(store.id);
  const rails = DB.rails.filter(r=>r.storeId===store.id);
  const avgLen = rails.length ? rails.reduce((a,r)=>a+(+r.length||0),0)/rails.length : 0;
  // пороги (№4)
  let longTh, shortTh;
  if(rails.length>=5){
    const lens = rails.map(r=>+r.length||0).sort((a,b)=>a-b);
    const med = lens[Math.floor(lens.length/2)];
    longTh = med; shortTh = med;
  } else { longTh = 4; shortTh = 1; }

  const recs = [];
  for(const f of folders){
    const cls = heatClass(f.perMeter, hm);
    const fr = rails.filter(r=>r.folder===f.path);
    for(const r of fr){
      const len = +r.length||0;
      if(cls==="cold" && len>=longTh)
        recs.push(`Переместить «${f.name}» с длинного рейла ${r.code} (${fmtM(len)} м) на 1 м`);
      if(cls==="hot" && len<=shortTh)
        recs.push(`Расширить «${f.name}» на рейле ${r.code} до 2 м`);
    }
  }
  document.getElementById("recs-body").innerHTML = recs.length
    ? recs.slice(0,20).map(r=>`<div class="list-item small">${escapeHtml(r)}</div>`).join("")
    : `<div class="empty">Рекомендаций нет</div>`;
}

function renderRailsDashboard(storeId){
  const rails = DB.rails.filter(r=>r.storeId===storeId);
  const walls = DB.walls.filter(w=>w.storeId===storeId);
  const hm = heatmap(storeId);

  const all = [];
  for(const r of rails){
    const d = distributeRevenue(storeId, r.folder);
    if(!d) continue;
    const rr = d.rails.find(x=>x.id===r.id);
    if(rr) all.push({...rr, folder:r.folder, name:r.code});
  }
  for(const w of walls){
    const d = distributeRevenue(storeId, w.folder);
    if(!d) continue;
    const ww = d.walls.find(x=>x.id===w.id);
    if(ww) all.push({kind:"wall", id:w.id, code:w.code, folder:w.folder,
      length:ww.length, perMeter:ww.perMeterFloor, revenue:ww.revenue, name:w.code});
  }
  if(!all.length){
    return `<div class="card"><div class="empty">
      Нет рейлов. Добавьте ряд и рейл, чтобы увидеть эффективность метра.
    </div></div>`;
  }
  const sorted = all.slice().sort((a,b)=>b.perMeter-a.perMeter);
  const best = sorted[0], worst = sorted[sorted.length-1];
  const avg = sorted.reduce((s,x)=>s+x.perMeter,0)/sorted.length;

  let html = `
    <div class="card">
      <h2>Hero</h2>
      <div class="grid2">
        <div class="kit" style="background:var(--emerald-l)">
          <div class="tiny">Лучший</div>
          <b>${escapeHtml(best.name)}</b>
          <div class="small">${fmt(best.perMeter)} ₽/м</div>
          <div class="tiny emerald">+${pct(best.perMeter-avg,avg)}% к среднему</div>
        </div>
        <div class="kit" style="background:var(--red-l)">
          <div class="tiny">Худший</div>
          <b>${escapeHtml(worst.name)}</b>
          <div class="small">${fmt(worst.perMeter)} ₽/м</div>
          <div class="tiny red">${pct(worst.perMeter-avg,avg)}% к среднему</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Рейлы и стены по ₽/м</h2>
      ${sorted.map(x=>`
        <div class="list-item">
          <div class="row">
            <div>
              <span class="heat-dot" style="background:${
                heatClass(x.perMeter,hm)==='hot'?'var(--emerald)':
                heatClass(x.perMeter,hm)==='cold'?'var(--red)':'var(--amber)'}"></span>
              <b>${escapeHtml(x.name)}</b>
              <span class="tiny muted">${x.kind==='wall'?'стена':'рейл'} · ${fmtM(x.length)} м</span>
            </div>
            <div style="text-align:right">
              <b>${fmt(x.perMeter)} ₽/м</b>
              <div class="tiny muted">${fmt(x.revenue)} ₽</div>
            </div>
          </div>
        </div>`).join("")}
    </div>
    <div class="card">
      <h2>До / После</h2>
      <button class="btn ghost block sm" onclick="fixMove()">📌 Зафиксировать перестановку</button>
      ${renderMoves(storeId)}
    </div>
  `;
  return html;
}

function renderMoves(storeId){
  const moves = DB.moves.filter(m=>m.storeId===storeId).sort((a,b)=>b.date.localeCompare(a.date));
  if(!moves.length) return `<div class="tiny muted" style="margin-top:8px">Перестановок пока нет</div>`;

function renderRailsCatalog(storeId){
  const rails = DB.rails.filter(r=>r.storeId===storeId);
  const walls = DB.walls.filter(w=>w.storeId===storeId);
  const hm = heatmap(storeId);
  const rows = [];
  for(const r of rails){

/* импорт */
let pendingImport = null;

function handleFile(ev){
  const f = ev.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = parseXlsx(e.target.result);
      const folders = nodesToFolders(parsed);
      const fromName = periodFromFilename(f.name);
      pendingImport = { parsed, folders, fromName, filename:f.name };
      showImportPreview();
    }catch(err){ alert("Ошибка парсинга: "+err.message); }
  };
  reader.readAsArrayBuffer(f);
  ev.target.value = "";
}

function showImportPreview(){
  const { parsed, folders, fromName } = pendingImport;
  const services = folders.filter(f=>f.isService).length;
  const returns = folders.filter(f=>f.isReturn).length;
  const first10 = parsed.nodes.slice(0,10).map(n=>`
    <div class="tiny" style="padding-left:${n.level*12}px;font-family:monospace">
      L${n.level} · ${escapeHtml(n.name)} · ${fmt(n.sum)} ₽
    </div>`).join("");
  const conv = parsed.convergence;
  const store = currentStore();
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>Предпросмотр импорта</h3>
    <div class="small" style="margin-bottom:8px">
      Найдено <b>${folders.length}</b> папок · служебных: <b>${services}</b> · возвратов: <b>${returns}</b>
    </div>
    ${parsed.flat ? `<div class="tiny" style="color:var(--amber)">⚠ Похоже, это плоский файл. Иерархия не определена.</div>`:""}
    ${conv ? `<div class="tiny" style="color:${conv.ok?'var(--emerald)':'var(--red)'}">
      ${conv.ok?'✓':'⚠'} Сходимость: ожидалось ${fmt(conv.expected)}, получено ${fmt(conv.got)}
    </div>`:""}
    <div style="max-height:200px;overflow:auto;margin:10px 0;background:var(--bg);padding:8px;border-radius:8px">
      ${first10}
    </div>
    ${fromName ? `<div class="small">Магазин: <b>${escapeHtml(fromName.storeName)}</b>, период: <b>${fromName.period}</b></div>`:
      `<div class="small" style="color:var(--amber)">Период не распознан из имени файла</div>
       <div class="grid2" style="margin-top:8px">
         <select id="imp-store" class="input">
           ${DB.stores.map(s=>`<option value="${s.id}" ${s.id===store?.id?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
         </select>
         <input id="imp-period" class="input" placeholder="YYYY-MM" value="${defaultPeriod()}">
       </div>`}
    <div style="margin-top:10px">
      <div class="tiny muted">Режим:</div>
      <div class="grid2" style="margin-top:4px">
        <button class="btn sm" onclick="applyImport('accumulate')">Накопить</button>
        <button class="btn sm ghost" onclick="applyImport('replace_period')">Заменить за период</button>
        <button class="btn sm danger" onclick="applyImport('replace_all')">Заменить всё</button>
      </div>
    </div>
  `);
}

function applyImport(mode){
  const store = currentStore();
  let storeId = store?.id;
  let period = pendingImport.fromName?.period;

  if(!pendingImport.fromName){
    storeId = document.getElementById("imp-store").value;
    period = document.getElementById("imp-period").value;
    if(!/^\d{4}-\d{2}$/.test(period)) return alert("Период в формате YYYY-MM");
  }
  if(!storeId) return alert("Сначала создайте магазин");

  // бэкап
  DB.meta.lastImportBackup[storeId] = JSON.parse(JSON.stringify({
    sales: DB.sales[storeId] || {},
    salesHistory: DB.salesHistory[storeId] || {}
  }));

  // подготовка
  if(mode==="replace_all"){
    DB.sales[storeId] = {};
    DB.salesHistory[storeId] = DB.salesHistory[storeId] || {};
    DB.salesHistory[storeId][period] = {};
  } else if(mode==="replace_period"){
    DB.salesHistory[storeId] = DB.salesHistory[storeId] || {};
    DB.salesHistory[storeId][period] = {};
  } else {
    DB.salesHistory[storeId] = DB.salesHistory[storeId] || {};
    DB.salesHistory[storeId][period] = DB.salesHistory[storeId][period] || {};
  }

  if(!DB.sales[storeId]) DB.sales[storeId] = {};
  const target = DB.sales[storeId];

  for(const f of pendingImport.folders){
    if(!target[f.path]) target[f.path] = { sum:0, qty:0, isService:f.isService,
      isReturn:f.isReturn, level:f.level };
    if(mode==="accumulate"){
      target[f.path].sum += f.sum;
      target[f.path].qty += f.qty;
    } else {
      target[f.path].sum = f.sum;
      target[f.path].qty = f.qty;
    }
    target[f.path].isService = f.isService;
    target[f.path].isReturn = f.isReturn;
    target[f.path].level = f.level;

    // история
    const h = DB.salesHistory[storeId][period];
    h[f.path] = h[f.path] || { sum:0 };
    if(mode==="accumulate") h[f.path].sum += f.sum;
    else h[f.path].sum = f.sum;
  }

  DB.meta.lastImport[storeId] = { date:new Date().toISOString(), period, mode };
  DB.meta.ui.storeId = storeId;
  DB.meta.ui.period = period;
  dbSave(); closeModal(); pendingImport = null; render();
}

function undoLastImport(){
  const store = currentStore(); if(!store) return;
  const backup = DB.meta.lastImportBackup[store.id];
  if(!backup) return alert("Нет данных для отмены");
  if(!confirm("Отменить последний импорт? Ручные правки пола и план не затрагиваются.")) return;
  DB.sales[store.id] = backup.sales;
  DB.salesHistory[store.id] = backup.salesHistory;
  delete DB.meta.lastImportBackup[store.id];
  delete DB.meta.lastImport[store.id];
  dbSave(); render();
}

  const kit = prompt("Кит (Одежда / Обувь / Аксессуары / Распродажа):","Одежда");
  if(!kit) return;
  DB.rows.push({ id:uid(), storeId:store.id, kit:KIT_MAP[kit]||"clothing",
    code, name:`Ряд ${code} (${kit})` });
  dbSave(); render();
}
function openAddWall(){
  const store = currentStore(); if(!store) return;
  const code = prompt("Код стены:"); if(!code) return;
  const length = +prompt("Длина, м:", "2") || 0;
  const tiers = +prompt("Ярусов:", "1") || 1;
  const rowId = DB.rows.find(r=>r.storeId===store.id)?.id || null;
  DB.walls.push({ id:uid(), storeId:store.id, rowId, code, name:code, length, tiers, folder:null });
  dbSave(); render();
}
function deleteEntity(kind, id){
  if(!confirm("Удалить?")) return;
  if(kind==="rail") DB.rails = DB.rails.filter(r=>r.id!==id);
  else if(kind==="wall"){
    DB.walls = DB.walls.filter(w=>w.id!==id);
    DB.brackets = DB.brackets.filter(b=>b.wallId!==id);
  }
  dbSave(); render();
}

/* фиксация перестановки */
function fixMove(){
  const store = currentStore(); if(!store) return;
  DB.moves.push({
    id:uid(), storeId:store.id, date:new Date().toISOString(),
    snapshot:{
      rails: DB.rails.filter(r=>r.storeId===store.id)
        .map(r=>({id:r.id, length:r.length, folder:r.folder})),
      walls: DB.walls.filter(w=>w.storeId===store.id)
        .map(w=>({id:w.id, length:w.length, tiers:w.tiers, folder:w.folder}))
    }
  });
  dbSave(); render();
}

/* ---------- ЭКСПОРТ ---------- */
function exportExcel(){
  const store = currentStore(); if(!store) return;
  const period = currentPeriod();
  const wb = XLSX.utils.book_new();

  const revenue = totalRevenue(store.id, period);
  const plan = autoPlan(store.id, period);
  const kits = kitsBreakdown(store.id);
  const folders = foldersWithMetrics(store.id).sort((a,b)=>b.sum-a.sum);

  const summary = [
    ["Магазин", store.name], ["Период", period],
    ["Выручка", revenue], ["План", plan.value], ["Выполнение, %", plan.value?pct(revenue,plan.value):"—"],
    [], ["Киты"], ...Object.entries(kits).map(([k,v])=>[KIT_LABEL[k]||k, v]),
    [], ["Топ-5 папок"],
    ...folders.slice(0,5).map((f,i)=>[`${i+1}. ${f.name}`, f.sum])
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "Сводка");

  const foldersSheet = [["Уровень","Папка","Выручка","Штуки","Метры","₽/м","Статус"]]
    .concat(folders.map(f=>[f.level, f.name, f.sum, f.qty, f.totalMeters,
      f.totalMeters?Math.round(f.perMeter):0,
      f.isService?"служебная":f.isReturn?"возврат":f.unplaced?"не размещено":"ok"]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(foldersSheet), "Папки");

  const railsRows = [["Ряд","Сторона","Код","Длина","Папка","Выручка","₽/м"]];
  for(const r of DB.rails.filter(x=>x.storeId===store.id)){
    const d = distributeRevenue(store.id, r.folder);
    const rr = d?.rails.find(x=>x.id===r.id);
    const row = DB.rows.find(x=>x.id===r.rowId);
    railsRows.push([row?.code||"—", r.side, r.code, r.length,
      r.folder?.split("/").pop()||"—", rr?.revenue||0, rr?.perMeter||0]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(railsRows), "Рейлы");

  XLSX.writeFile(wb, `Метраж_${store.name}_${period}.xlsx`);
}

function exportJson(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `metrag_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm("Заменить все данные из файла?")) return;
      DB = data; dbSave(); render();
    }catch(err){ alert("Ошибка: "+err.message); }
  };
  r.readAsText(f);
  ev.target.value = "";
}

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(t=>`

      <svg viewBox="0 0 24 24"><path d="${t.icon}" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${t.label}
    </button>`).join("");

function switchTab(id){
  currentTab = id;
  if(id==="home"||id==="analytics"||id==="rails") DB.meta.ui.storeId = currentStore()?.id;
  dbSave();
  render();
}
function goToTab2(dep){

function renderHeader(){
  const store = currentStore();
  const period = currentPeriod();
  const lastImp = store && DB.meta.lastImport[store.id];
  const title = store ? store.name : "Метраж";
  const sub = lastImp
    ? `Данные: ${periodLabel(period)} · импорт ${lastImp.date.slice(0,10)}`
    : `Период: ${periodLabel(period)} · нет импорта`;
  document.getElementById("top").innerHTML = `
    <h1><span class="store-btn" onclick="openStoresSheet()">${escapeHtml(title)}</span></h1>
    <div class="sub">${sub}</div>
  `;
}

  renderNav();

}
